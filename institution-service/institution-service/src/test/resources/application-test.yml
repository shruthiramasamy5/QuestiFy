spring:
  datasource:
    url: jdbc:h2:mem:institution_service;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

questify:
  jwt:
    secret: test-secret-key-for-institution-service-unit-tests-0123456789

logging:
  level:
    root: WARN
