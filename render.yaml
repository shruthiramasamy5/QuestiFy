# ==============================================================================
# QuestiFy Render Blueprint (render.yaml)
# Unified deployment for the entire QuestiFy microservice platform
# Accessible through ONE single public URL (questify-frontend)
# ==============================================================================
version: "1"

# Shared Environment Variables & Secrets across the Fleet
envVarGroups:
  - name: questify-fleet-config
    envVars:
      - key: QUESTIFY_JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_USERNAME
        value: 46r3xHThXTDDdCZ.root
      - key: DB_PASSWORD
        value: qOn7ZSVI8VxygMUb
      - key: DB_USE_SSL
        value: "true"
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

services:
  # ============================================================================
  # 1. PUBLIC WEB ENTRYPOINT: React + Vite Frontend (Nginx Reverse Proxy)
  # ONLY this service is public. Users access the entire system through this URL.
  # ============================================================================
  - type: web
    name: questify-frontend
    runtime: docker
    dockerContext: questify-frontend-fixed/questify-frontend
    dockerfilePath: questify-frontend-fixed/questify-frontend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: GATEWAY_URL
        value: https://questify-api-gateway.onrender.com

  # ============================================================================
  # 2. API Gateway (Spring Cloud Gateway) - Edge Router
  # ============================================================================
  - type: web
    name: questify-api-gateway
    runtime: docker
    dockerContext: questify-backend/questify-backend
    dockerfilePath: questify-backend/questify-backend/api-gateway/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8000
      - key: SERVER_PORT
        value: 8000
      - key: AUTH_SERVICE_URL
        value: https://questify-auth-service.onrender.com
      - key: INSTITUTION_SERVICE_URL
        value: https://questify-institution-service.onrender.com
      - key: QUESTION_BANK_SERVICE_URL
        value: https://questify-question-bank-service.onrender.com
      - key: AI_SERVICE_URL
        value: https://questify-ai-service.onrender.com
      - key: PAPER_GENERATION_SERVICE_URL
        value: https://questify-paper-generation-service.onrender.com
      - key: PAPERS_SERVICE_URL
        value: https://questify-papers-service.onrender.com
      - key: APPROVAL_SERVICE_URL
        value: https://questify-approval-service.onrender.com
      - key: ANALYTICS_SERVICE_URL
        value: https://questify-analytics-service.onrender.com
      - key: BACKUP_SERVICE_URL
        value: https://questify-backup-service.onrender.com
      - key: AUDIT_LOG_SERVICE_URL
        value: https://questify-audit-log-service.onrender.com
      - key: ML_HEALTH_SERVICE_URL
        value: https://questify-ml-health-service.onrender.com

  # ============================================================================
  # 3. Auth Service (:8081)
  # ============================================================================
  - type: web
    name: questify-auth-service
    runtime: docker
    dockerContext: questify-backend/questify-backend
    dockerfilePath: questify-backend/questify-backend/auth-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8081
      - key: SERVER_PORT
        value: 8081

  # ============================================================================
  # 4. Institution Service (:8082)
  # ============================================================================
  - type: web
    name: questify-institution-service
    runtime: docker
    dockerContext: institution-service/institution-service
    dockerfilePath: institution-service/institution-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8082
      - key: SERVER_PORT
        value: 8082
      - key: DB_NAME
        value: institution_service

  # ============================================================================
