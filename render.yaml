# ==============================================================================
# QuestiFy Render Blueprint (render.yaml)
# Unified deployment for the entire QuestiFy microservice platform
# Accessible through ONE single public URL (questify-frontend)
# ==============================================================================
version: "1"

# Shared Environment Variables & Secrets across the Fleet
envVarGroups:
  - name: questify-fleet-config
    envVars:
      - key: QUESTIFY_JWT_SECRET
        generateValue: true
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: QuestifyRoot@2026
      - key: MYSQL_ROOT_PASSWORD
        value: QuestifyRoot@2026
      - key: DB_HOST
        value: questify-mysql
      - key: DB_PORT
        value: "3306"
      - key: EUREKA_SERVER_URL
        value: http://questify-eureka-server:8761/eureka/
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

services:
  # ============================================================================
  # 1. PUBLIC WEB ENTRYPOINT: React + Vite Frontend (Nginx Reverse Proxy)
  # ONLY this service is public. Users access the entire system through this URL.
  # ============================================================================
  - type: web
    name: questify-frontend
    runtime: docker
    dockerContext: questify-frontend-fixed/questify-frontend
    dockerfilePath: questify-frontend-fixed/questify-frontend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: GATEWAY_URL
        value: http://questify-api-gateway:8000

  # ============================================================================
  # 2. API Gateway (Spring Cloud Gateway) - Internal Edge Router
  # ============================================================================
  - type: web
    name: questify-api-gateway
    runtime: docker
    dockerContext: questify-backend/questify-backend
    dockerfilePath: questify-backend/questify-backend/api-gateway/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8000
      - key: SERVER_PORT
        value: 8000
      - key: AUTH_SERVICE_URL
        value: http://questify-auth-service:8081
      - key: INSTITUTION_SERVICE_URL
        value: http://questify-institution-service:8082
      - key: QUESTION_BANK_SERVICE_URL
        value: http://questify-question-bank-service:8083
      - key: AI_SERVICE_URL
        value: http://questify-ai-service:8084
      - key: PAPER_GENERATION_SERVICE_URL
        value: http://questify-paper-generation-service:8085
      - key: PAPERS_SERVICE_URL
        value: http://questify-papers-service:8086
      - key: APPROVAL_SERVICE_URL
        value: http://questify-approval-service:8087
      - key: ANALYTICS_SERVICE_URL
        value: http://questify-analytics-service:8088
      - key: BACKUP_SERVICE_URL
        value: http://questify-backup-service:8089
      - key: AUDIT_LOG_SERVICE_URL
        value: http://questify-audit-log-service:8090
      - key: ML_HEALTH_SERVICE_URL
        value: http://questify-ml-health-service:8091

  # ============================================================================
  # 3. Eureka Service Registry
  # ============================================================================
  - type: web
    name: questify-eureka-server
    runtime: docker
    dockerContext: questify-backend/questify-backend
    dockerfilePath: questify-backend/questify-backend/eureka-server/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8761
      - key: SERVER_PORT
        value: 8761
      - key: EUREKA_INSTANCE_HOSTNAME
        value: questify-eureka-server

  # ============================================================================
  # 4. Auth Service (:8081)
  # ============================================================================
  - type: web
    name: questify-auth-service
    runtime: docker
    dockerContext: questify-backend/questify-backend
    dockerfilePath: questify-backend/questify-backend/auth-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8081
      - key: SERVER_PORT
        value: 8081

  # ============================================================================
  # 5. Institution Service (:8082)
  # ============================================================================
  - type: web
    name: questify-institution-service
    runtime: docker
    dockerContext: institution-service/institution-service
    dockerfilePath: institution-service/institution-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8082
      - key: SERVER_PORT
        value: 8082
      - key: DB_NAME
        value: institution_service

  # ============================================================================
  # 6. Question Bank Service (:8083)
  # ============================================================================
  - type: web
    name: questify-question-bank-service
    runtime: docker
    dockerContext: question-bank-service/question-bank-service
    dockerfilePath: question-bank-service/question-bank-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8083
      - key: SERVER_PORT
        value: 8083

  # ============================================================================
  # 7. AI Service (:8084)
  # ============================================================================
  - type: web
    name: questify-ai-service
    runtime: docker
    dockerContext: ai-service/ai-service
    dockerfilePath: ai-service/ai-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8084
      - key: SERVER_PORT
        value: 8084
      - key: GEMINI_API_KEY
        sync: false

  # ============================================================================
  # 8. Paper Generation Service (:8085)
  # ============================================================================
  - type: web
    name: questify-paper-generation-service
    runtime: docker
    dockerContext: paper-generation-service/paper-generation-service
    dockerfilePath: paper-generation-service/paper-generation-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8085
      - key: SERVER_PORT
        value: 8085
      - key: MONGODB_URI
        value: mongodb://questify-mongodb:27017/paper_generation_service

  # ============================================================================
  # 9. Papers Service (:8086)
  # ============================================================================
  - type: web
    name: questify-papers-service
    runtime: docker
    dockerContext: papers-service/papers-service
    dockerfilePath: papers-service/papers-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8086
      - key: SERVER_PORT
        value: 8086

  # ============================================================================
  # 10. Approval Service (:8087)
  # ============================================================================
  - type: web
    name: questify-approval-service
    runtime: docker
    dockerContext: approval-service/approval-service
    dockerfilePath: approval-service/approval-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8087
      - key: SERVER_PORT
        value: 8087

  # ============================================================================
  # 11. Analytics Service (:8088)
  # ============================================================================
  - type: web
    name: questify-analytics-service
    runtime: docker
    dockerContext: analytics-service/analytics-service
    dockerfilePath: analytics-service/analytics-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8088
      - key: SERVER_PORT
        value: 8088

  # ============================================================================
  # 12. Backup Service (:8089)
  # ============================================================================
  - type: web
    name: questify-backup-service
    runtime: docker
    dockerContext: backup-service/backup-service
    dockerfilePath: backup-service/backup-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8089
      - key: SERVER_PORT
        value: 8089

  # ============================================================================
  # 13. Audit Log Service (:8090)
  # ============================================================================
  - type: web
    name: questify-audit-log-service
    runtime: docker
    dockerContext: audit-log-service/audit-log-service
    dockerfilePath: audit-log-service/audit-log-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8090
      - key: SERVER_PORT
        value: 8090
      - key: MONGODB_URI
        value: mongodb://questify-mongodb:27017/audit_log_service

  # ============================================================================
  # 14. ML Health Service (:8091)
  # ============================================================================
  - type: web
    name: questify-ml-health-service
    runtime: docker
    dockerContext: ml-health-service/ml-health-service
    dockerfilePath: ml-health-service/ml-health-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 8091
      - key: SERVER_PORT
        value: 8091

  # ============================================================================
  # 15. MySQL Database (Self-hosted on Render with pre-baked schemas)
  # ============================================================================
  - type: web
    name: questify-mysql
    runtime: docker
    dockerContext: docker/mysql
    dockerfilePath: docker/mysql/Dockerfile
    plan: free
    region: oregon
    envVars:
      - fromGroup: questify-fleet-config
      - key: PORT
        value: 3306

  # ============================================================================
  # 16. MongoDB Database (Self-hosted on Render)
  # ============================================================================
  - type: web
    name: questify-mongodb
    runtime: docker
    dockerContext: docker/mongodb
    dockerfilePath: docker/mongodb/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 27017
