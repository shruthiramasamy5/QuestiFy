spring:
  datasource:
    url: jdbc:h2:mem:papers;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false

questify:
  jwt:
    secret: questify-shared-development-secret-key-change-me-32bytes
