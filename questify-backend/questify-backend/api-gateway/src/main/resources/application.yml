server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_FIRST
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            - id: question-bank-service
              uri: ${QUESTION_BANK_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/questions/**,/api/question-drafts/**,/api/co-mapping/**

            - id: paper-generation-service
              uri: ${PAPER_GENERATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/generate/**

            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/ai/**

            - id: institution-service
              uri: ${INSTITUTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/institutions/**,/api/departments/**,/api/templates/**,/api/plan-usage/**

            - id: papers-service
              uri: ${PAPERS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/papers/**

            - id: approval-service
              uri: ${APPROVAL_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/approvals/**

            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/analytics/**

            - id: backup-service
              uri: ${BACKUP_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/backups/**

            - id: audit-log-service
              uri: ${AUDIT_LOG_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/audit-events/**

            - id: ml-health-service
              uri: ${ML_HEALTH_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/ml-health/**

questify:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_URL:${EUREKA_URI:http://localhost:8761/eureka/}}}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO

