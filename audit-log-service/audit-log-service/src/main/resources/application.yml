server:
  port: 8090

spring:
  application:
    name: audit-log-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/audit_log_service}
      auto-index-creation: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_URL:${EUREKA_URI:http://localhost:8761/eureka/}}}
  instance:
    prefer-ip-address: true

questify:
  jwt:
    secret: ${QUESTIFY_JWT_SECRET:${JWT_SECRET:questify-dev-secret-key-change-me-before-deploying-anywhere-real}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.questify.audit: INFO
