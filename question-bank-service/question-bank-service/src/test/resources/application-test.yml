spring:
  datasource:
    url: jdbc:h2:mem:question_bank_service;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

questify:
  jwt:
    secret: test-secret-key-for-questify-question-bank-service-0123456789

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
