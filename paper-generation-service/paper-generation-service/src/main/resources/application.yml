server:
  port: 8085

spring:
  application:
    name: paper-generation-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb+srv://shruthiramasamy5_db_user:ZKxaL4MlT420PlOF@cluster0.cwqbldx.mongodb.net/paper_generation_service?retryWrites=true&w=majority}}
      auto-index-creation: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_URL:${EUREKA_URI:http://localhost:8761/eureka/}}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

questify:
  jwt:
    secret: ${QUESTIFY_JWT_SECRET:${JWT_SECRET:questify-dev-secret-key-change-me-before-deploying-anywhere-real}}
    roles-claim: roles
  ai:
    # Feature flag: attempt AI-assisted selection via ai-service before
    # falling back to rule-based selection. ai-service itself decides real
    # availability (Anthropic API key configured or not) at call time -
    # this flag just lets AI selection be turned off here without touching
    # ai-service's own config.
    enabled: ${AI_SELECTION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.questify.papergen: INFO
