server:
  port: 8091

spring:
  application:
    name: ml-health-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_URL:${EUREKA_URI:http://localhost:8761/eureka/}}}
  instance:
    prefer-ip-address: true

questify:
  jwt:
    secret: ${QUESTIFY_JWT_SECRET:${JWT_SECRET:questify-dev-secret-key-change-me-before-deploying-anywhere-real}}
  ml:
    # URL of the EXTERNAL AI/ML service. No model is implemented or mocked here.
    endpoint: ${QUESTIFY_ML_ENDPOINT:http://localhost:9000/health}
    timeout: 5s
    probe-interval: 60s
    window-size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.questify.mlhealth: INFO
